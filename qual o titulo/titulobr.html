<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qual é a Tradução - PagoMeia Oscar</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#111;
font-family:'Press Start 2P',cursive;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
text-align:center;
}

h1{
margin-top:20px;
color:#FFD700;
text-shadow:3px 3px #000;
}

#hud{
margin:15px;
display:flex;
gap:40px;
}

#poster img{
width:230px;
border-radius:10px;
margin-top:20px;
}

#original{
margin-top:15px;
font-size:0.7em;
color:#FFD700;
}

.options{
margin-top:25px;
display:flex;
flex-direction:column;
gap:15px;
width:85%;
max-width:500px;
}

button{
padding:12px;
cursor:pointer;
font-family:'Press Start 2P';
border:none;
border-radius:8px;
font-size:0.6em;
background:#333;
color:#fff;
}

button:hover{
transform:scale(1.05);
}

.correct{
background:#00cc66;
}

.wrong{
background:#cc3333;
}

#result{
margin-top:20px;
min-height:30px;
}

#lives{
color:#ff4d4d;
}
</style>
</head>
<body>

<h1>🏆 QUAL É A TRADUÇÃO?</h1>

<div id="hud">
<div>Pontos: <span id="score">0</span></div>
<div>Vidas: <span id="lives">❤❤❤</span></div>
</div>

<div id="poster"></div>
<div id="original"></div>

<div class="options" id="options"></div>

<div id="result"></div>

<script>
const API_KEY="69f20920b621de40289df7481ea14b29";
const IMG="https://image.tmdb.org/t/p/w300";

let score=0;
let lives=3;
let currentMovie=null;
let correctAnswer="";
let usedMovies=new Set();

const OSCAR_IDS=[
13,424,122,680,278,238,155,240,497,14,
1891,857,98,105,311,73,629,597,289,550,
27205,637,85,807,19404
];

function shuffle(array){
return array.sort(()=>Math.random()-0.5);
}

function generateSmartFakes(realTitle){

let words=realTitle.split(" ");
let fakes=[];

if(words.length>2){

// Troca última palavra
let fake1=[...words];
fake1[fake1.length-1]="Destino";
fakes.push(fake1.join(" "));

// Remove palavra do meio
let fake2=[...words];
fake2.splice(1,1);
fakes.push(fake2.join(" "));

}else{

// Troca plural/singular simples
let fake1=realTitle.replace("Os ","O ");
let fake2=realTitle+" Final";

fakes.push(fake1);
fakes.push(fake2);
}

return fakes;
}

async function fetchOscarMovie(){

let id;

while(true){
id=OSCAR_IDS[Math.floor(Math.random()*OSCAR_IDS.length)];
if(!usedMovies.has(id)){
usedMovies.add(id);
break;
}
}

const res=await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${API_KEY}&language=pt-BR`);
return await res.json();
}

function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("lives").innerText="❤".repeat(lives);
}

async function nextRound(){

currentMovie=await fetchOscarMovie();

document.getElementById("poster").innerHTML=
`<img src="${IMG+currentMovie.poster_path}">`;

document.getElementById("original").innerText=
`Título Original: ${currentMovie.original_title}`;

correctAnswer=currentMovie.title;

const fakes=generateSmartFakes(correctAnswer);

let options=[correctAnswer,...fakes];
options=shuffle(options);

const container=document.getElementById("options");
container.innerHTML="";

options.forEach(option=>{
const btn=document.createElement("button");
btn.innerText=option;
btn.onclick=()=>answer(option,btn);
container.appendChild(btn);
});

document.getElementById("result").innerText="";
}

function answer(choice,btn){

const buttons=document.querySelectorAll(".options button");
buttons.forEach(b=>b.disabled=true);

if(choice===correctAnswer){
score++;
btn.classList.add("correct");
document.getElementById("result").innerText="✅ ACERTOU!";
}else{
lives--;
btn.classList.add("wrong");
document.getElementById("result").innerText="❌ ERROU!";
if(lives<=0){
alert("GAME OVER - Pontos: "+score);
location.reload();
return;
}
}

updateHUD();
setTimeout(nextRound,1500);
}

updateHUD();
nextRound();
</script>

</body>
</html>
