}

.nominee{
    padding:8px 12px;
    margin:5px;
    background:#222;
    border:1px solid #555;
    border-radius:8px;
    cursor:grab;
    display:inline-block;
}

.nominee:hover{
    background:#444;
}

button{
    display:block;
    margin:40px auto;
    padding:15px 30px;
    font-size:18px;
    background:#d4af37;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#f5d27a;
}

<!-- MODELO DE CATEGORIA -->
<script>
function createCategory(title, nominees){
    const container = document.createElement("div");
    container.className = "category";

    container.innerHTML = `
        <h2>${title}</h2>
        <div class="tier winner" ondrop="drop(event)" ondragover="allowDrop(event)">
            🏆 Vencedor
        </div>
        <div class="tier runner" ondrop="drop(event)" ondragover="allowDrop(event)">
            🎬 Outros Indicados
        </div>
        <div>
            ${nominees.map(n => `<div class="nominee" draggable="true" ondragstart="drag(event)">${n}</div>`).join("")}
        </div>
    `;

    document.getElementById("content").appendChild(container);
}
</script>

<script>
function allowDrop(ev){
    ev.preventDefault();
}

function drag(ev){
    ev.dataTransfer.setData("text", ev.target.outerHTML);
    ev.target.remove();
}

function drop(ev){
    ev.preventDefault();
    var data = ev.dataTransfer.getData("text");
    ev.target.innerHTML += data;
}

function tirarPrint(){
    html2canvas(document.body).then(canvas=>{
        const link = document.createElement("a");
        link.download = "meu-bolao-oscar-2026.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>
