<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão Oscar 2026 | PagoMeia</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
body{
  margin:0;
  background: radial-gradient(circle at top,#1a1a1a,#000);
  color:#fff;
  font-family:'Press Start 2P',monospace;
}

header{
  text-align:center;
  background: linear-gradient(90deg,#d4af37,#f5d27a,#d4af37);
  color:#000;
  padding:25px;
  font-size:26px;
  font-weight:bold;
}

.category{
  margin:20px;
  border:2px solid #d4af37;
  border-radius:12px;
  padding:12px;
  background:#111;
}

.category h2{
  color:#f5d27a;
  text-align:center;
  margin:0 0 10px 0;
}

.tiers{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:10px;
}

.winner{
  flex:1;
  padding:10px;
  border:2px dashed #ffd700;
  min-height:50px;
  cursor:pointer;
  background:rgba(255,215,0,0.1);
  text-align:center;
  font-size:0.7em;
}

.nominees{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}

.nominee{
  background:#222;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
  font-size:0.7em;
  border:1px solid #555;
  text-align:center;
}

.nominee:hover{
  background:#333;
}

button{
  margin:30px auto;
  display:block;
  padding:14px 28px;
  background:#d4af37;
  border:none;
  font-size:18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#f5d27a;
}
</style>
</head>

<body>

<header>
BOLÃO OSCAR 2026 🏆  
Escolha quem VOCÊ acha que vai ganhar!
</header>

<div id="tier-content"></div>

<button onclick="takeScreenshot()">
📸 TIRAR SCREENSHOT
</button>

<script>
const tierData={

  "Melhor Filme":[
    "Bugonia","F1","Frankenstein","Hamnet","Marty Supreme",
    "One Battle After Another","The Secret Agent","Sentimental Value",
    "Sinners","Train Dreams"
  ],

  "Melhor Ator":[
    "Timothée Chalamet – Marty Supreme",
    "Leonardo DiCaprio – One Battle After Another",
    "Ethan Hawke – Blue Moon",
    "Michael B. Jordan – Sinners",
    "Wagner Moura – The Secret Agent"
  ],

  "Melhor Atriz":[
    "Jessie Buckley – Hamnet",
    "Rose Byrne – If I Had Legs I'd Kick You",
    "Kate Hudson – Song Sung Blue",
    "Renate Reinsve – Sentimental Value",
    "Emma Stone – Bugonia"
  ],

  "Melhor Ator Coadjuvante":[
    "Benicio Del Toro – One Battle After Another",
    "Jacob Elordi – Frankenstein",
    "Delroy Lindo – Sinners",
    "Sean Penn – One Battle After Another",
    "Stellan Skarsgård – Sentimental Value"
  ],

  "Melhor Atriz Coadjuvante":[
    "Elle Fanning – Sentimental Value",
    "Inga Ibsdotter Lilleaas – Sentimental Value",
    "Amy Madigan – Weapons",
    "Wunmi Mosaku – Sinners",
    "Teyana Taylor – One Battle After Another"
  ],

  "Melhor Direção":[
    "Paul Thomas Anderson – One Battle After Another",
    "Ryan Coogler – Sinners",
    "Chloé Zhao – Hamnet",
    "Joachim Trier – Sentimental Value",
    "Josh Safdie – Marty Supreme"
  ],

  "Melhor Roteiro Original":[
    "Blue Moon","It Was Just an Accident","Marty Supreme",
    "Sentimental Value","Sinners"
  ],

  "Melhor Roteiro Adaptado":[
    "Bugonia","Frankenstein","Hamnet",
    "One Battle After Another","Train Dreams"
  ],

  "Melhor Trilha Sonora":[
    "Bugonia","Frankenstein","Hamnet",
    "One Battle After Another","Sinners"
  ]
};

const container=document.getElementById("tier-content");

Object.keys(tierData).forEach(category=>{
  const catDiv=document.createElement("div");
  catDiv.className="category";
  catDiv.innerHTML=`
    <h2>${category}</h2>
    <div class="tiers">
      <div class="winner" data-cat="${category}" onclick="selectWinner(event)">
        🏆 Seu Vencedor
      </div>
    </div>
    <div class="nominees" id="nom-${category}">
    </div>
  `;
  container.appendChild(catDiv);

  tierData[category].forEach(item=>{
    const btn=document.createElement("div");
    btn.className="nominee";
    btn.innerText=item;
    btn.onclick=e=>pickNominee(e,item,category);
    document.getElementById("nom-"+category).appendChild(btn);
  });
});

function pickNominee(e,item,category){
  const winnerBox=document.querySelector(`.winner[data-cat="${category}"]`);
  winnerBox.innerText="🏆 " + item;
}

function takeScreenshot(){
  html2canvas(document.body).then(canvas=>{
    const link=document.createElement("a");
    link.download="bolao-oscar-2026.png";
    link.href=canvas.toDataURL();
    link.click();
  });
}
</script>

</body>
</html>
