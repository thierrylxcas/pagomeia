<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PagoMeia Games</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Press Start 2P', cursive; /* Fonte pixel */
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #FF8C00, #FFA500, #FFD700); /* degradê laranja/amarelo */
  }

  .menu-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    text-align: center;
  }

  h1 {
    font-size: 2em;
    color: #5D3A8C; /* roxo */
    text-shadow: 3px 3px #00000080; /* sombra pixel */
    margin-bottom: 20px;
  }

  .menu-button {
    padding: 15px 40px;
    font-size: 0.8em;
    color: #5D3A8C;
    background-color: #FFFFFF20;
    border: 3px solid #5D3A8C;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    min-width: 250px;
    text-align: center;
    transition: all 0.2s ease;
    box-shadow: 4px 4px 0px #000; /* efeito pixelado */
  }

  .menu-button:hover {
    background-color: #5D3A8C;
    color: #FFD700;
    transform: translateY(-4px);
    box-shadow: 6px 6px 0px #000;
  }

  /* Indicador de seleção estilo game */
  .menu-button::before {
    content: "▶ ";
    opacity: 0;
    transition: opacity 0.2s;
  }
  .menu-button:hover::before {
    opacity: 1;
  }

  /* Responsivo */
  @media (max-width: 600px) {
    h1 { font-size: 1.5em; }
    .menu-button { font-size: 0.7em; min-width: 180px; padding: 12px 25px; }
  }
</style>
</head>
<body>

<div class="menu-container">
<h1>ESCOLHA UM GAME</h1>
<a href="./tierlist/index.html" target="_blank">📋 TIERLIST</a>
<a href="./quiz/quizbr.html" target="_blank">🎬 Quiz do BRAZA</a>
<a href="./framed/index.html" target="_blank">🎬 FRAMED</a>
</div>

</body>
</html>
