<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PagoMeia Games</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Press Start 2P', cursive;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #6C3BAA, #7F00FF);
  }

  .menu-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    text-align: center;
  }

  h1 {
    font-size: 2em;
    color: #FFED29;
    text-shadow: 3px 3px #00000080;
    margin-bottom: 20px;
  }

  .menu-button {
    position: relative;
    padding: 15px 40px;
    font-size: 0.8em;
    color: #ffffff;
    background-color: #e6b800; /* amarelo mais escuro */
    border: 3px solid #5D3A8C;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    min-width: 250px;
    text-align: center;
    transition: all 0.3s ease;
    box-shadow: 6px 6px 0px #000; /* sombra projetada */
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000; /* contorno preto */
  }

  .menu-button:hover {
    transform: translateY(-6px) scale(1.05); /* animação leve de pop */
    box-shadow: 10px 10px 0px #000;
    background-color: #d4a500;
    color: #ffffff;
  }

  /* Indicador de seleção estilo game */
  .menu-button::before {
    content: "▶ ";
    opacity: 0;
    transition: opacity 0.2s;
  }
  .menu-button:hover::before {
    opacity: 1;
  }

  /* Responsivo */
  @media (max-width: 600px) {
    h1 { font-size: 1.5em; }
    .menu-button { font-size: 0.7em; min-width: 180px; padding: 12px 25px; }
  }
</style>
</head>
<body>

<div class="menu-container">
  <h1>ESCOLHA UM GAME</h1>
  <a href="./tierlist/index.html" target="_blank" class="menu-button">📋 TIERLIST</a>
  <a href="./quiz/quizbr.html" target="_blank" class="menu-button">🎬 Quiz do BRAZA</a>
  <a href="./framed/index.html" target="_blank" class="menu-button">🎬 FRAMED</a>
  <a href="./wiki/meiatrivia.html" target="_blank" class="menu-button">🎬 PagoMeia Trivia</a>
</div>

</body>
</html>
