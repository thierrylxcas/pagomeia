<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeiaOscar - PagoMeia</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#111;
font-family:'Press Start 2P',cursive;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
overflow-x:hidden;
}

h1{
margin-top:20px;
color:#FFD700;
text-shadow:3px 3px #000;
}

#hud{
margin:10px;
display:flex;
gap:40px;
}

#timeline{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:15px;
max-width:1200px;
margin:20px;
}

.movie{
width:120px;
cursor:grab;
text-align:center;
}

.movie img{
width:100%;
border-radius:8px;
}

.year{
font-weight:bold;
margin-top:5px;
}

.year.error{
color:red;
}

#lives{
color:#ff4d4d;
}

#current{
margin-top:10px;
}

button{
margin-top:15px;
padding:10px 20px;
cursor:pointer;
font-family:'Press Start 2P';
background:#FFD700;
border:none;
}
</style>
</head>
<body>

<h1>🏆 MEIAOSCAR - HARD</h1>

<div id="hud">
<div>Pontos: <span id="score">0</span></div>
<div>Vidas: <span id="lives">❤❤❤</span></div>
</div>

<div id="timeline"></div>

<div id="current"></div>

<script>
const API_KEY="69f20920b621de40289df7481ea14b29";
const IMG="https://image.tmdb.org/t/p/w200";

let timeline=[];
let score=0;
let lives=3;
let minYearGap=6;

async function fetchRandomMovie(){
let valid=false;
let movie;

while(!valid){
const page=Math.floor(Math.random()*20)+1;
const res=await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc&page=${page}`);
const data=await res.json();
movie=data.results[Math.floor(Math.random()*data.results.length)];

if(!movie.release_date) continue;

const year=parseInt(movie.release_date.split("-")[0]);

if(timeline.every(m=>Math.abs(m.year-year)>=minYearGap)){
valid=true;
movie.year=year;
}
}

return movie;
}

function renderTimeline(){
const container=document.getElementById("timeline");
container.innerHTML="";
timeline.forEach(m=>{
const div=document.createElement("div");
div.className="movie";
div.innerHTML=`
<img src="${IMG+m.poster_path}">
<div class="year ${m.error?'error':''}">${m.year}</div>
`;
container.appendChild(div);
});
}

function updateLives(){
document.getElementById("lives").innerText="❤".repeat(lives);
}

function updateScore(){
document.getElementById("score").innerText=score;
}

function checkDifficulty(){
if(score%5===0 && minYearGap>2){
minYearGap--;
}
}

function gameOver(){
alert("GAME OVER - Pontos: "+score);
location.reload();
}

function insertMovie(movie){
timeline.push(movie);
timeline.sort((a,b)=>a.year-b.year);
renderTimeline();
}

async function nextRound(){
const movie=await fetchRandomMovie();
const currentDiv=document.getElementById("current");
currentDiv.innerHTML=`
<div class="movie" draggable="true">
<img src="${IMG+movie.poster_path}">
</div>
`;

const draggable=currentDiv.querySelector(".movie");

draggable.addEventListener("dragstart",e=>{
e.dataTransfer.setData("year",movie.year);
e.dataTransfer.setData("poster",movie.poster_path);
});
}

const timelineDiv=document.getElementById("timeline");

timelineDiv.addEventListener("dragover",e=>{
e.preventDefault();
});

timelineDiv.addEventListener("drop",e=>{
e.preventDefault();

const year=parseInt(e.dataTransfer.getData("year"));
const poster=e.dataTransfer.getData("poster");

let correctIndex=timeline.findIndex(m=>m.year>year);
if(correctIndex===-1) correctIndex=timeline.length;

const dropX=e.clientX;
const dropY=e.clientY;

const elements=[...timelineDiv.children];
let visualIndex=elements.findIndex(el=>{
const rect=el.getBoundingClientRect();
return dropY<rect.bottom && dropX<rect.left+rect.width/2;
});
if(visualIndex===-1) visualIndex=timeline.length;

const correct=(visualIndex===correctIndex);

const movie={year,poster_path:poster};

if(correct){
score++;
checkDifficulty();
}else{
movie.error=true;
lives--;
updateLives();
if(lives<=0){
insertMovie(movie);
gameOver();
return;
}
}

timeline.splice(correctIndex,0,movie);
renderTimeline();
updateScore();
nextRound();
});

(async()=>{
const first=await fetchRandomMovie();
timeline.push(first);
renderTimeline();
nextRound();
})();
</script>

</body>
</html>
