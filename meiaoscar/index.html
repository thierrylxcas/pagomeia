<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MeiaOscar</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b1b;
  --gold1:#d4af37;
  --gold2:#f5d76e;
  --goldGlow:rgba(212,175,55,0.4);
  --red:#ff4d4d;
  --text:#ffffff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#2a2000,var(--bg));
  color:var(--text);
  overflow:hidden;
}

/* CENTRALIZAÇÃO ABSOLUTA */
.wrapper{
  height:100vh;
  width:100vw;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.game{
  width:100%;
  max-width:1100px;
  height:95vh;
  display:flex;
  flex-direction:column;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.hearts{font-size:20px}
.score{font-size:16px}

.board{
  flex:1;
  background:var(--card);
  border-radius:22px;
  padding:20px;
  box-shadow:0 0 40px var(--goldGlow);
  text-align:center;
  border:2px solid var(--gold1);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.title{
  font-size:24px;
  font-weight:800;
  background:linear-gradient(45deg,var(--gold1),var(--gold2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:10px;
}

.instruction{
  font-family:'Press Start 2P', monospace;
  color:var(--gold2);
  font-size:10px;
  margin-bottom:15px;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;
}

.movie{
  width:140px;
  cursor:grab;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.year{
  font-size:13px;
  font-weight:800;
  margin-top:6px;
  visibility:hidden;
}
.year.show{visibility:visible}
.year.wrong{color:var(--red)}

#current{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:180px;
}

.timeline{
  position:relative;
  padding:25px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg,transparent,var(--gold1),transparent);
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:15px;
  min-height:170px;
  flex-wrap:wrap;
}

.placeholder{
  border:2px dashed var(--gold1);
  border-radius:14px;
  opacity:.4;
}

/* RESPONSIVO NOTEBOOK PEQUENO */
@media(max-height:750px){
  .movie{width:120px;}
  .instruction{font-size:8px;}
}
</style>
</head>
<body>

<div class="wrapper">
<div class="game">

<header>
  <div class="hearts" id="hearts">❤️❤️❤️</div>
  <div class="score">⭐ Pontos: <strong id="score">0</strong></div>
</header>

<div class="board">

  <div>
    <div class="title">🏆 MeiaOscar</div>
    <div class="instruction">
      Arraste o vencedor de Melhor Filme para a posição correta na linha do tempo.
    </div>
  </div>

  <div id="current"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>

</div>
</div>
</div>

<!-- MANTIVE SEU JS EXATAMENTE IGUAL -->
<script src="index.js"></script>

</body>
</html>
