<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicado ou Ignorado - PagoMeia</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#111;
font-family:'Press Start 2P',cursive;
color:#fff;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
text-align:center;
}

h1{
margin-top:20px;
color:#FFD700;
text-shadow:3px 3px #000;
}

#hud{
margin:10px;
display:flex;
gap:40px;
}

#poster img{
width:250px;
border-radius:10px;
margin-top:20px;
}

.buttons{
margin-top:20px;
display:flex;
gap:30px;
}

button{
padding:15px 25px;
cursor:pointer;
font-family:'Press Start 2P';
border:none;
border-radius:8px;
font-size:0.7em;
}

.indicado{
background:#FFD700;
color:#000;
}

.ignorado{
background:#444;
color:#fff;
}

#result{
margin-top:15px;
min-height:30px;
}

#lives{
color:#ff4d4d;
}
</style>
</head>
<body>

<h1>🏆 INDICADO ou IGNORADO</h1>

<div id="hud">
<div>Pontos: <span id="score">0</span></div>
<div>Vidas: <span id="lives">❤❤❤</span></div>
</div>

<div id="poster"></div>

<div class="buttons">
<button class="indicado" onclick="answer(true)">🏆 INDICADO</button>
<button class="ignorado" onclick="answer(false)">❌ IGNORADO</button>
</div>

<div id="result"></div>

<script>
const API_KEY="69f20920b621de40289df7481ea14b29";
const IMG="https://image.tmdb.org/t/p/w300";

let score=0;
let lives=3;
let currentMovie=null;
let isOscarMovie=false;

// 🔥 Lista real de filmes indicados ao Oscar
const OSCAR_IDS = [
  497,      // The Green Mile
  680,      // Pulp Fiction
  13,       // Forrest Gump
  122,      // Lord of the Rings Return of the King
  155,      // The Dark Knight
  27205,    // Inception
  550,      // Fight Club
  238,      // The Godfather
  424,      // Schindler's List
  129,      // Spirited Away
  49026     // The Dark Knight Rises
];

async function fetchRandomPopular(){
const page=Math.floor(Math.random()*20)+1;
const res=await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&sort_by=popularity.desc&page=${page}`);
const data=await res.json();

let movie=data.results[Math.floor(Math.random()*data.results.length)];

while(!movie.poster_path){
movie=data.results[Math.floor(Math.random()*data.results.length)];
}

return movie;
}

async function fetchMovie(){
const chooseOscar = Math.random() < 0.5;

if(chooseOscar){
  const randomId = OSCAR_IDS[Math.floor(Math.random()*OSCAR_IDS.length)];
  const res = await fetch(`https://api.themoviedb.org/3/movie/${randomId}?api_key=${API_KEY}`);
  const data = await res.json();
  isOscarMovie = true;
  return data;
}else{
  const movie = await fetchRandomPopular();
  isOscarMovie = false;
  return movie;
}
}

function updateHUD(){
document.getElementById("score").innerText=score;
document.getElementById("lives").innerText="❤".repeat(lives);
}

async function nextRound(){
currentMovie = await fetchMovie();

document.getElementById("poster").innerHTML =
`<img src="${IMG+currentMovie.poster_path}">`;

document.getElementById("result").innerText="";
}

function answer(choice){

if(choice===isOscarMovie){
score++;
document.getElementById("result").innerText="✅ ACERTOU!";
}else{
lives--;
document.getElementById("result").innerText="❌ ERROU!";
if(lives<=0){
alert("GAME OVER - Pontos: "+score);
location.reload();
return;
}
}

updateHUD();
setTimeout(nextRound,1000);
}

updateHUD();
nextRound();
</script>

</body>
</html>
