<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PagoMeia Frames</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{
  margin:0;
  background:#2b004b; /* roxo escuro */
  color:#fff;
  font-family:'Press Start 2P', cursive;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

h1{
  margin-bottom:10px;
  text-align:center;
  color:#ffd700;
  text-shadow: 2px 2px #000;
}

#frame-container{
  width:90%;
  max-width:800px;
  background:#5a0080;
  padding:8px;
  border:4px solid #ffd700;
  border-radius:4px;
  box-shadow:6px 6px 0px #000;
  display:flex;
  flex-direction:column;
  align-items:center;
}

#frame{
  width:100%;
  max-height:60vh;
  object-fit:cover;
  border:2px solid #ffd700;
  border-radius:2px;
  image-rendering: pixelated;
  filter:blur(12px);
  transition: all 0.3s ease;
}

#counter, #tries{
  margin-top:6px;
  color:#ffd700;
  text-shadow: 1px 1px #000;
  animation: pulse 1.5s infinite alternate;
}

#answer{
  font-size:16px;
  margin-top:10px;
  color:#ffffff;
  text-shadow: 2px 2px #000;
}

.buttons{
  margin-top:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

button{
  padding:10px 20px;
  font-family:'Press Start 2P', cursive;
  font-size:0.7em;
  color:#fff;
  background:#ffd700;
  border:3px solid #5a0080;
  cursor:pointer;
  box-shadow: 4px 4px 0px #000;
  transition: all 0.2s ease;
}

button:hover{
  background:#5a0080;
  color:#ffd700;
  transform: translateY(-2px) scale(1.05);
  box-shadow: 6px 6px 0px #000;
}

input[type=text]{
  padding:10px;
  font-family:'Press Start 2P', cursive;
  border:3px solid #ffd700;
  border-radius:4px;
  width:60%;
  max-width:300px;
  background:#2b004b;
  color:#fff;
  box-shadow: 4px 4px 0px #000;
}

input[type=text]::placeholder{
  color:#ffd700;
  opacity:0.7;
}

@keyframes pulse{
  0% {transform: scale(1);}
  100% {transform: scale(1.1);}
}
</style>
</head>
<body>

<h1>🎬 Adivinhe o Filme</h1>

<div id="frame-container">
  <img id="frame" src="" alt="Cena do filme">
  <div id="counter">Imagem 1/5</div>
  <div id="tries">Tentativas restantes: 4</div>
</div>

<div class="buttons">
  <button id="prev">Voltar</button>
  <button id="reveal">Revelar Resposta</button>
  <button id="next">Próximo</button>
</div>

<div style="margin-top:10px;">
  <input type="text" id="movieInput" placeholder="Digite o nome do filme">
  <button id="submitBtn">Enviar</button>
</div>

<div id="answer"></div>

<script>
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG_BASE = "https://image.tmdb.org/t/p/original";

let currentMovie = null;
let images = [];
let step = 0;
let triesLeft = 4;

async function getRandomMovie(){
  const page = Math.floor(Math.random()*500)+1;
  const res = await fetch(
    `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=pt-BR&sort_by=popularity.desc&page=${page}`
  );
  const data = await res.json();
  const movie = data.results[Math.floor(Math.random()*data.results.length)];
  return movie;
}

async function getImagesForMovie(movie){
  try{
    const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}/images?api_key=${API_KEY}`);
    const data = await res.json();
    let imgs = data.backdrops || [];

    if(imgs.length === 0 && movie.poster_path){
      imgs = [{file_path: movie.poster_path}];
    }

    if(imgs.length < 3) return [];

    imgs = imgs.sort(()=>0.5-Math.random()).slice(0,5);

    while(imgs.length < 5){
      imgs.push(imgs[0]);
    }

    return imgs.map(i => IMG_BASE + i.file_path);
  } catch(e){
    console.error("Erro ao buscar imagens:", e);
    return [];
  }
}

async function newRound(){
  document.getElementById("answer").innerText = "";
  step = 0;
  triesLeft = 4;
  document.getElementById("counter").innerText = `Imagem 1/5`;
  document.getElementById("tries").innerText = `Tentativas restantes: ${triesLeft}`;

  currentMovie = await getRandomMovie();
  images = await getImagesForMovie(currentMovie);

  if(images.length === 0){
    console.log("Filme sem imagens válidas, tentando outro...");
    return newRound();
  }

  showImage();
}

function showImage(){
  const img = document.getElementById("frame");
  img.src = images[step];
  img.style.filter = step < 4 ? "blur(12px)" : "blur(0)";
  document.getElementById("counter").innerText = `Imagem ${step+1}/5`;
}

// Botões de navegação
document.getElementById("next").onclick = () => {
  if(step < 4){
    step++;
    showImage();
  }
};

document.getElementById("prev").onclick = () => {
  if(step > 0){
    step--;
    showImage();
  }
};

document.getElementById("reveal").onclick = () => {
  step = 4;
  showImage();
  document.getElementById("answer").innerText = currentMovie.title;
};

// Verificação de resposta com tentativas extras
const input = document.getElementById("movieInput");
const submitBtn = document.getElementById("submitBtn");
const answerDiv = document.getElementById("answer");
const triesDiv = document.getElementById("tries");

submitBtn.onclick = () => {
  const userAnswer = input.value.trim().toLowerCase();
  const correctAnswer = currentMovie.title.trim().toLowerCase();

  if(userAnswer === ""){
    answerDiv.innerText = "Digite algo!";
    return;
  }

  if(correctAnswer.includes(userAnswer)){
    answerDiv.innerText = `✅ Acertou! O filme é "${currentMovie.title}"`;
    step = 4;
    showImage();
  } else {
    triesLeft--;
    if(triesLeft > 0){
      answerDiv.innerText = `❌ Errado! Tente novamente.`;
      triesDiv.innerText = `Tentativas restantes: ${triesLeft}`;
    } else {
      answerDiv.innerText = `❌ PERDEU! O filme era "${currentMovie.title}"`;
      step = 4;
      showImage();
      triesDiv.innerText = `Tentativas esgotadas`;
    }
  }

  input.value = "";
};

// inicia primeira rodada
newRound();
</script>

</body>
</html>
