<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Filmes Brasileiros 🇧🇷</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #004400, #006600); /* degradê verde escuro */
    color: #fff;
    text-align: center;
    padding: 50px;
    overflow-x: hidden;
    position: relative;
  }
  h1 { 
    font-weight: bold;
    font-size: 2em;
    margin-bottom: 10px; 
    color: #FFD700; 
    text-shadow: 2px 2px #006600;
  }
  .score { font-size: 1.2em; margin-bottom: 20px; color: #FFD700; text-shadow: 1px 1px #006600; }
  .question { font-size: 1.2em; margin-bottom: 20px; color: #fff; text-shadow: 1px 1px #000; }
  .options { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
  button { 
    padding: 12px; 
    font-size: 1em; 
    cursor: pointer; 
    border: none; 
    border-radius: 8px; 
    transition: 0.2s; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
    background-color: #FFD700;
    color: #006600;
    font-weight: bold;
  }
  button:hover { transform: scale(1.05); box-shadow: 0 6px 10px rgba(0,0,0,0.5); }
  .correct { background-color: #00FF00; color: #006600; }
  .wrong { background-color: #FF4500; color: #fff; }
  .disabled { pointer-events: none; opacity: 0.6; }
  .message { font-size: 1.5em; margin-top: 20px; text-shadow: 1px 1px #000; }
  .message.lost { font-size: 2em; font-weight: bold; color: #fff; text-shadow: 2px 2px #000; }
  .answer-correct { font-size: 1.2em; color: #FFD700; margin-top: 10px; text-shadow: 1px 1px #000; }
  #quiz-image { width: 300px; margin-top: 20px; display: none; border-radius: 10px; border: 4px solid #FFD700; box-shadow: 0 0 15px #FFD700; }
  #restart-btn { display: none; margin-top: 20px; padding: 12px 25px; font-size: 1em; cursor: pointer; border-radius: 8px; background-color: #FFD700; color: #006600; border: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
  /* Confete */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    background-color: yellow;
    top: -10px;
    z-index: 9999;
    opacity: 0.9;
    pointer-events: none;
    animation: fall 3s linear forwards;
    border-radius: 50%;
  }
  @keyframes fall {
    to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
  }
  /* Bandeira animada */
  #bandeira {
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    z-index: 9998;
    display: none;
    animation: slideDown 2s forwards, fadeOut 2s 2s forwards;
  }
  @keyframes slideDown {
    to { top: 50px; }
  }
  @keyframes fadeOut {
    to { opacity: 0; }
  }
</style>
</head>
<body>

<h1>Quiz de Filmes Brasileiros 🇧🇷</h1>
<div class="score">Acertos consecutivos: <span id="score">0</span></div>
<div class="question">Carregando pergunta...</div>
<div class="options"></div>
<div class="message"></div>
<div class="answer-correct"></div>
<img id="quiz-image" src="" alt="Imagem do filme/ator">
<img id="bandeira" src="https://upload.wikimedia.org/wikipedia/commons/0/05/Flag_of_Brazil.svg" alt="Bandeira do Brasil">
<button id="restart-btn">Reiniciar Quiz</button>

<script>
const API_KEY = '69f20920b621de40289df7481ea14b29'; // Substitua pela sua chave TMDb
const BASE_URL = 'https://api.themoviedb.org/3';

const questionEl = document.querySelector('.question');
const optionsEl = document.querySelector('.options');
const messageEl = document.querySelector('.message');
const answerEl = document.querySelector('.answer-correct');
const imgEl = document.getElementById('quiz-image');
const bandeiraEl = document.getElementById('bandeira');
const restartBtn = document.getElementById('restart-btn');
const scoreEl = document.getElementById('score');

let currentQuestion = null;
let score = 0;

function shuffleArray(array) { return array.sort(() => Math.random() - 0.5); }
function filterText(text) { return text.replace(/[^\x00-\x7FÀ-ú ]/g, ''); }

function createConfetti() {
  for(let i=0;i<50;i++){
    const c = document.createElement('div');
    c.classList.add('confetti');
    c.style.left = Math.random() * window.innerWidth + 'px';
    c.style.backgroundColor = Math.random() > 0.5 ? '#FFD700' : '#00BFFF';
    c.style.width = c.style.height = Math.random() * 8 + 5 + 'px';
    c.style.animationDuration = 2 + Math.random() * 2 + 's';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4000);
  }
}

function showBandeira() {
  bandeiraEl.style.display = 'block';
  setTimeout(()=>{ bandeiraEl.style.display = 'none'; }, 4000);
}

async function fetchMovies() {
  const page = Math.floor(Math.random() * 20) + 1;
  const response = await fetch(`${BASE_URL}/discover/movie?api_key=${API_KEY}&with_original_language=pt&region=BR&sort_by=popularity.desc&page=${page}&language=pt-BR`);
  const data = await response.json();
  return data.results;
}

async function fetchCast(movieId) {
  const response = await fetch(`${BASE_URL}/movie/${movieId}/credits?api_key=${API_KEY}&language=pt-BR`);
  const data = await response.json();
  const validCast = data.cast.filter(c => c.character && c.character.toLowerCase() !== 'self' && c.character.toLowerCase() !== 'archive footage');
  return validCast;
}

async function questionCharacterActor() {
  const movies = await fetchMovies();
  const movie = movies[Math.floor(Math.random() * movies.length)];
  const cast = await fetchCast(movie.id);
  if(!cast || cast.length === 0) return questionCharacterActor();
  const actor = cast[Math.floor(Math.random() * cast.length)];
  const wrongActors = shuffleArray(cast.filter(c => c.id !== actor.id)).slice(0,3).map(c => c.name);
  const options = shuffleArray([actor.name, ...wrongActors]).map(filterText);
  const questionText = `Quem interpretou "${filterText(actor.character || "personagem")}" em "${filterText(movie.title)}"?`;
  return { questionText, correctAnswer: filterText(actor.name), options, imagePath: actor.profile_path };
}

async function questionActorMovie() {
  const movies = await fetchMovies();
  const movie = movies[Math.floor(Math.random() * movies.length)];
  const cast = await fetchCast(movie.id);
  if(!cast || cast.length === 0) return questionActorMovie();
  const actor = cast[Math.floor(Math.random() * cast.length)];
  const wrongMovies = shuffleArray(movies.filter(m => m.id !== movie.id)).slice(0,3).map(m => m.title);
  const options = shuffleArray([movie.title, ...wrongMovies]).map(filterText);
  const questionText = `Em qual filme "${filterText(actor.name)}" atuou?`;
  return { questionText, correctAnswer: filterText(movie.title), options, imagePath: movie.poster_path };
}

async function questionYearMovie() {
  const movies = await fetchMovies();
  const movie = movies[Math.floor(Math.random() * movies.length)];
  const wrongMovies = shuffleArray(movies.filter(m => m.id !== movie.id)).slice(0,3).map(m => m.title);
  const options = shuffleArray([movie.title, ...wrongMovies]).map(filterText);
  const questionText = `Qual destes filmes foi lançado em ${movie.release_date ? movie.release_date.slice(0,4) : "?"}?`;
  return { questionText, correctAnswer: filterText(movie.title), options, imagePath: movie.poster_path };
}

async function generateQuestion() {
  const types = [questionCharacterActor, questionActorMovie, questionYearMovie];
  const func = types[Math.floor(Math.random() * types.length)];
  return func();
}

async function nextQuestion() {
  messageEl.textContent = '';
  messageEl.classList.remove('lost');
  answerEl.textContent = '';
  optionsEl.innerHTML = '';
  imgEl.style.display = 'none';
  restartBtn.style.display = 'none';
  questionEl.textContent = 'Carregando pergunta...';
  currentQuestion = await generateQuestion();
  questionEl.textContent = currentQuestion.questionText;
  currentQuestion.options.forEach(option => {
    const btn = document.createElement('button');
    btn.textContent = option;
    btn.onclick = () => handleAnswer(option, btn);
    optionsEl.appendChild(btn);
  });
}

function handleAnswer(option, btn) {
  const correct = option === currentQuestion.correctAnswer;
  if(correct){
    btn.classList.add('correct');
    score++;
    scoreEl.textContent = score;
    if(currentQuestion.imagePath){
      imgEl.src = `https://image.tmdb.org/t/p/w300${currentQuestion.imagePath}`;
      imgEl.style.display = 'block';
    }
    createConfetti();
    showBandeira();
    setTimeout(nextQuestion, 1500);
  } else {
    btn.classList.add('wrong');
    imgEl.style.display = 'none';
    messageEl.textContent = 'PERDEU AMIGO 😢';
    messageEl.classList.add('lost');
    answerEl.textContent = `Resposta correta: ${currentQuestion.correctAnswer}`;
    Array.from(optionsEl.children).forEach(b => b.classList.add('disabled'));
    restartBtn.style.display = 'inline-block';
    score = 0;
    scoreEl.textContent = score;
  }
}

restartBtn.onclick = () => nextQuestion();
nextQuestion();
</script>

</body>
</html>
