<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MovieTrivia • História do Cinema</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b26;
  --purple:#7f3dff;
  --purple2:#a57bff;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#1b1038,var(--bg));
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:30px 20px;
}

.game{
  max-width:900px;
  width:100%;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.stats{
  display:flex;
  gap:20px;
  font-size:14px;
}

.board{
  background:var(--card);
  border-radius:22px;
  padding:25px;
  box-shadow:0 0 40px rgba(127,61,255,.15);
}

.movies{
  display:flex;
  justify-content:center;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.movie{
  width:140px;
  text-align:center;
  cursor:grab;
  animation:fade .25s ease;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.movie p{
  font-size:13px;
  margin-top:8px;
}

.timeline{
  position:relative;
  margin:20px 0;
  padding:35px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(127,61,255,.35),
    transparent
  );
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:18px;
  position:relative;
  z-index:2;
  min-height:190px;
}

button{
  margin-top:20px;
  padding:12px 26px;
  border:none;
  border-radius:999px;
  background:linear-gradient(135deg,var(--purple),var(--purple2));
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.25s;
}

button:hover{
  transform:scale(1.05);
}

.placeholder{
  opacity:.25;
  border:2px dashed var(--purple);
  border-radius:14px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}
</style>
</head>
<body>

<div class="game">

<header>
  <h1>🎬 MovieTrivia</h1>
  <div class="stats">
    <div>❌ Erros: <strong id="errors">0</strong></div>
    <div>🏆 Recorde: <strong id="record">—</strong></div>
  </div>
</header>

<div class="board">
  <p>Arraste os filmes para a linha do tempo, do mais antigo ao mais recente.</p>

  <div class="movies" id="movies"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>

  <button onclick="checkOrder()">Confirmar ordem</button>
</div>

</div>

<script>
// =============================
// TMDB
// =============================
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG = "https://image.tmdb.org/t/p/w500";

// =============================
// FILMES (história do cinema)
// =============================
const pool = [
  {id:770, year:1939},     // E o Vento Levou
  {id:539, year:1960},     // Psicose
  {id:238, year:1972},     // Poderoso Chefão
  {id:11, year:1977},      // Star Wars
  {id:329, year:1993},     // Jurassic Park
  {id:603, year:1999},     // Matrix
  {id:120, year:2001},     // Senhor dos Anéis
  {id:19995, year:2009},   // Avatar
  {id:299534, year:2019},  // Ultimato
  {id:872585, year:2023}   // Oppenheimer
];

let round = pool.slice(0,4);
let errors = 0;
let dragged = null;
let placeholder = null;

const record = localStorage.getItem("movieTriviaCinema");
document.getElementById("record").innerText = record ?? "—";

const moviesDiv = document.getElementById("movies");
const timeline = document.getElementById("timeline");

// =============================
async function load(){
  moviesDiv.innerHTML = "";
  timeline.innerHTML = "";

  round = round.sort(()=>Math.random()-0.5);

  for(const m of round){
    const res = await fetch(
      `https://api.themoviedb.org/3/movie/${m.id}?api_key=${API_KEY}&language=pt-BR`
    );
    const data = await res.json();

    const card = document.createElement("div");
    card.className = "movie";
    card.draggable = true;
    card.dataset.year = m.year;
    card.innerHTML = `
      <img src="${IMG + data.poster_path}">
      <p>${data.title}</p>
    `;

    addDragEvents(card);
    moviesDiv.appendChild(card);
  }
}

// =============================
// DRAG UX BOM
// =============================
function addDragEvents(card){
  card.addEventListener("dragstart", ()=>{
    dragged = card;
    card.style.opacity = ".4";

    placeholder = document.createElement("div");
    placeholder.className = "movie placeholder";
    placeholder.style.width = card.offsetWidth + "px";
    placeholder.style.height = card.offsetHeight + "px";
  });

  card.addEventListener("dragend", ()=>{
    card.style.opacity = "1";
    placeholder?.remove();
    dragged = null;
  });
}

timeline.addEventListener("dragover", e=>{
  e.preventDefault();
  const after = getAfterElement(timeline, e.clientX);
  if(after == null){
    timeline.appendChild(placeholder);
  }else{
    timeline.insertBefore(placeholder, after);
  }
});

timeline.addEventListener("drop", e=>{
  e.preventDefault();
  if(dragged && placeholder){
    timeline.insertBefore(dragged, placeholder);
    placeholder.remove();
  }
});

function getAfterElement(container, x){
  const items = [...container.querySelectorAll(".movie:not(.placeholder)")];
  return items.reduce((closest, child)=>{
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if(offset < 0 && offset > closest.offset){
      return {offset, element: child};
    }
    return closest;
  }, {offset:Number.NEGATIVE_INFINITY}).element;
}

// =============================
function checkOrder(){
  const items = [...timeline.querySelectorAll(".movie")];
  if(items.length !== round.length){
    alert("Arraste todos os filmes para a linha do tempo!");
    return;
  }

  const years = items.map(i=>Number(i.dataset.year));
  const sorted = [...years].sort((a,b)=>a-b);

  if(JSON.stringify(years) === JSON.stringify(sorted)){
    alert("🎉 Ordem correta! Cinema puro!");
    if(!record || errors < record){
      localStorage.setItem("movieTriviaCinema", errors);
    }
  }else{
    errors++;
    document.getElementById("errors").innerText = errors;
    alert("❌ Ordem errada! Um novo filme entrou.");

    if(pool.length > round.length){
      round.push(pool[round.length]);
    }
    load();
  }
}

load();
</script>

</body>
</html>
