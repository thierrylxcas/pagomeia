<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MeiaWiki</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b26;
  --purple:#7f3dff;
  --red:#ff4d4d;
  --yellow:#ffd800;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#1b1038,var(--bg));
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:25px;
}

.game{max-width:980px;width:100%}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.hearts{font-size:20px}
.score{font-size:16px}

.board{
  background:var(--card);
  border-radius:22px;
  padding:25px;
  box-shadow:0 0 40px rgba(127,61,255,.18);
  text-align:center;
}

.instruction{
  font-family:'Press Start 2P', monospace;
  color:var(--yellow);
  font-size:12px;
  margin-bottom:25px;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

.current{margin-bottom:25px}

.movie{
  width:150px;
  cursor:grab;
  transition:.25s ease;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.movie p{
  font-size:13px;
  margin:6px 0 0;
}

.year{
  font-size:12px;
  opacity:.75;
  visibility:hidden;
}

.year.show{visibility:visible}
.year.wrong{color:var(--red)}

.timeline{
  position:relative;
  margin-top:30px;
  padding:40px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(127,61,255,.35),
    transparent
  );
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:18px;
  min-height:210px;
}

.placeholder{
  border:2px dashed var(--purple);
  border-radius:14px;
  opacity:.35;
}
</style>
</head>
<body>

<div class="game">

<header>
  <div class="hearts" id="hearts">❤️❤️❤️</div>
  <div class="score">⭐ Pontos: <strong id="score">0</strong></div>
</header>

<div class="board">
  <div class="instruction">
    Arraste o filme para a posição correta na linha do tempo.
  </div>

  <div class="current" id="current"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>
</div>

</div>

<script>
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG = "https://image.tmdb.org/t/p/w500";

let lives = 3;
let score = 0;
let difficulty = 0;
let dragged = null;
let placeholder = null;

const basePool = [
  {id:770, year:1939},
  {id:539, year:1960},
  {id:238, year:1972},
  {id:11, year:1977},
  {id:329, year:1993},
  {id:603, year:1999},
  {id:120, year:2001},
  {id:19995, year:2009},
  {id:299534, year:2019},
  {id:872585, year:2023},
  {id:424, year:1994},     // Pulp Fiction
  {id:680, year:1994},     // Forrest Gump
  {id:155, year:2008},     // Batman Dark Knight
  {id:27205, year:2010},   // Inception
  {id:13, year:1994}       // Forrest
];

let pool = shuffle([...basePool]);
let index = 0;

const timeline = document.getElementById("timeline");
const current = document.getElementById("current");

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

function updateHUD(){
  document.getElementById("hearts").innerText = "❤️".repeat(lives);
  document.getElementById("score").innerText = score;
}

async function createCard(movie, reveal){
  const res = await fetch(
    `https://api.themoviedb.org/3/movie/${movie.id}?api_key=${API_KEY}&language=pt-BR`
  );
  const data = await res.json();

  const card = document.createElement("div");
  card.className = "movie";
  card.dataset.year = movie.year;
  card.draggable = true;

  card.innerHTML = `
    <img src="${IMG + data.poster_path}">
    <p>${data.title}</p>
    <div class="year ${reveal ? "show" : ""}">${movie.year}</div>
  `;

  enableDrag(card);
  return card;
}

function enableDrag(card){
  card.addEventListener("dragstart", ()=>{
    dragged = card;
    card.style.opacity = ".4";

    placeholder = document.createElement("div");
    placeholder.className = "movie placeholder";
    placeholder.style.width = card.offsetWidth+"px";
    placeholder.style.height = card.offsetHeight+"px";
  });

  card.addEventListener("dragend", ()=>{
    card.style.opacity = "1";
    placeholder?.remove();
  });
}

timeline.addEventListener("dragover", e=>{
  e.preventDefault();
  const after = getAfter(timeline, e.clientX);
  after ? timeline.insertBefore(placeholder, after)
        : timeline.appendChild(placeholder);
});

timeline.addEventListener("drop", ()=>{
  if(!dragged) return;

  timeline.insertBefore(dragged, placeholder);
  placeholder.remove();
  dragged.querySelector(".year").classList.add("show");

  validate();
});

function getAfter(container, x){
  const els = [...container.querySelectorAll(".movie:not(.placeholder)")];
  return els.reduce((c, el)=>{
    const box = el.getBoundingClientRect();
    const offset = x - box.left - box.width/2;
    if(offset < 0 && offset > c.offset){
      return {offset, el};
    }
    return c;
  },{offset:-Infinity}).el;
}

function validate(){
  const items = [...timeline.children];
  const years = items.map(i=>+i.dataset.year);
  const sorted = [...years].sort((a,b)=>a-b);

  if(JSON.stringify(years) === JSON.stringify(sorted)){
    score += Math.max(5, 15 - difficulty);
    difficulty++;
    nextMovie();
  }else{
    lives--;
    dragged.querySelector(".year").classList.add("wrong");
    updateHUD();

    if(lives <= 0){
      alert("💀 GAME OVER\nPontuação: " + score);
      location.reload();
    }else{
      timeline.removeChild(dragged);
      nextMovie();
    }
  }
}

async function nextMovie(){
  if(index >= pool.length){
    pool = shuffle([...basePool]);
    index = 0;
  }

  current.innerHTML = "";
  const card = await createCard(pool[index++], false);
  current.appendChild(card);
  updateHUD();
}

(async()=>{
  const first = await createCard(pool[index++], true);
  timeline.appendChild(first);
  nextMovie();
})();
</script>

</body>
</html>
