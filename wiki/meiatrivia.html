<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>MeiaTrivia • PagoMeia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b24;
  --accent:#8b5cf6;
  --error:#ef4444;
  --line:#4b5563;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:radial-gradient(circle at top,#1c1c2b,#0f0f14);
  font-family:Inter,Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  padding:20px;
}

.game{width:100%;max-width:1000px}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:20px;
}

.hearts span{font-size:20px;margin-left:4px}
.hearts .lost{opacity:.25}

/* TIMELINE */
.timeline-wrapper{
  position:relative;
  overflow-x:auto;
  padding:60px 0 30px;
}

.timeline-line{
  position:absolute;
  top:95px;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(to right,transparent,var(--line),transparent);
}

.timeline{
  display:flex;
  align-items:flex-start;
  padding:0 20px;
}

.timeline-item{
  width:90px;
  text-align:center;
  position:relative;
}

.timeline-item::before{
  content:"";
  position:absolute;
  top:-30px;
  left:50%;
  width:2px;
  height:30px;
  background:var(--line);
}

.timeline-item img{
  width:100%;
  border-radius:10px;
  box-shadow:0 10px 25px rgba(0,0,0,.5);
}

.year{
  margin-top:6px;
  font-size:13px;
  opacity:.85;
}

.year.error{
  color:var(--error);
  font-weight:700;
}

/* DROP ZONE */
.drop-zone{
  width:40px;
  height:160px;
}

.drop-zone.active{
  background:rgba(139,92,246,.15);
  border-radius:10px;
}

/* CURRENT */
.current{
  width:150px;
  margin:25px auto 0;
  background:var(--card);
  border-radius:14px;
  overflow:hidden;
  cursor:grab;
  box-shadow:0 14px 35px rgba(0,0,0,.5);
}

.current.dragging{opacity:.6}

.current img{width:100%}
.current h2{
  font-size:14px;
  padding:10px;
  text-align:center;
}

/* GAME OVER */
.game-over{
  display:none;
  text-align:center;
  margin-top:25px;
}

.game-over button{
  margin-top:12px;
  padding:12px 22px;
  background:var(--accent);
  border:none;
  border-radius:8px;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="game">

  <div class="top">
    <div>
      Pontos: <span id="score">0</span> |
      Recorde: <span id="highScore">0</span>
    </div>
    <div class="hearts" id="hearts"></div>
  </div>

  <div class="timeline-wrapper">
    <div class="timeline-line"></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="current" id="current" draggable="true">
    <img id="poster">
    <h2 id="title"></h2>
  </div>

  <div class="game-over" id="gameOver">
    <h2>💀 Game Over</h2>
    <button onclick="restart()">Reiniciar</button>
  </div>

</div>

<script>
const API_KEY="69f20920b621de40289df7481ea14b29";
const IMG="https://image.tmdb.org/t/p/w300";

let timeline=[];
let pool=[];
let used=new Set();
let current=null;
let score=0;
let lives=3;

const timelineEl=document.getElementById("timeline");
const scoreEl=document.getElementById("score");

/* UI */
function renderHearts(){
  hearts.innerHTML="";
  for(let i=0;i<3;i++){
    const s=document.createElement("span");
    s.textContent="❤️";
    if(i>=lives)s.classList.add("lost");
    hearts.appendChild(s);
  }
}

function loadHighScore(){
  highScore.textContent=
    localStorage.getItem("meiaTriviaHighScore")||0;
}

/* TMDB */
async function loadPool(){
  pool=[];
  for(let p=1;p<=6;p++){
    const r=await fetch(
      `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&language=pt-BR&page=${p}`
    );
    const d=await r.json();
    pool.push(...d.results.filter(m=>m.release_date&&m.poster_path));
  }
  pool.sort(()=>Math.random()-0.5);
}

function nextMovie(){
  const m=pool.find(m=>!used.has(m.id));
  current={...m};
  used.add(current.id);
  poster.src=IMG+current.poster_path;
  title.textContent=current.title;
}

/* TIMELINE (CORRIGIDA) */
function renderTimeline(){
  timelineEl.innerHTML="";

  // DROP ANTES DO PRIMEIRO
  createDropZone(0);

  timeline.forEach((item,i)=>{
    const el=document.createElement("div");
    el.className="timeline-item";
    el.innerHTML=`
      <img src="${IMG+item.poster_path}">
      <div class="year ${item.wrong?'error':''}">
        ${item.release_date.slice(0,4)}
      </div>`;
    timelineEl.appendChild(el);

    // DROP DEPOIS DE CADA ITEM
    createDropZone(i+1);
  });
}

function createDropZone(index){
  const dz=document.createElement("div");
  dz.className="drop-zone";
  dz.ondragover=e=>{e.preventDefault();dz.classList.add("active");};
  dz.ondragleave=()=>dz.classList.remove("active");
  dz.ondrop=()=>placeMovie(index);
  timelineEl.appendChild(dz);
}

function placeMovie(index){
  const attempt=[...timeline];
  attempt.splice(index,0,current);

  const sorted=[...attempt].sort(
    (a,b)=>new Date(a.release_date)-new Date(b.release_date)
  );

  if(attempt.map(m=>m.id).join()==sorted.map(m=>m.id).join()){
    timeline=attempt;
    score++;
    scoreEl.textContent=score;
  }else{
    lives--;
    renderHearts();
    const correctIndex=sorted.findIndex(m=>m.id===current.id);
    current.wrong=true;
    timeline.splice(correctIndex,0,current);
    if(lives<=0)return endGame();
  }

  renderTimeline();
  nextMovie();
}

/* DRAG */
currentEl=document.getElementById("current");
currentEl.ondragstart=()=>currentEl.classList.add("dragging");
currentEl.ondragend=()=>currentEl.classList.remove("dragging");

/* FLOW */
function endGame(){
  gameOver.style.display="block";
  const hs=Math.max(
    score,
    localStorage.getItem("meiaTriviaHighScore")||0
  );
  localStorage.setItem("meiaTriviaHighScore",hs);
  loadHighScore();
}

async function restart(){
  timeline=[];
  used.clear();
  score=0;
  lives=3;
  scoreEl.textContent=0;
  gameOver.style.display="none";
  renderHearts();
  await loadPool();
  timeline.push(pool.shift());
  renderTimeline();
  nextMovie();
}

async function start(){
  loadHighScore();
  renderHearts();
  await loadPool();
  timeline.push(pool.shift());
  renderTimeline();
  nextMovie();
}

start();
</script>
</body>
</html>
