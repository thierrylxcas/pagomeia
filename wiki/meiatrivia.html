<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MeiaWiki</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b26;
  --purple:#7f3dff;
  --red:#ff4d4d;
  --yellow:#ffd800;
  --text:#fff;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#1b1038,var(--bg));
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:25px;
}

.game{max-width:980px;width:100%}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.hearts{font-size:20px}
.score{font-size:16px}

.board{
  background:var(--card);
  border-radius:22px;
  padding:25px;
  box-shadow:0 0 40px rgba(127,61,255,.18);
  text-align:center;
}

.instruction{
  font-family:'Press Start 2P', monospace;
  color:var(--yellow);
  font-size:12px;
  margin-bottom:25px;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;
}

.movie{
  width:150px;
  cursor:grab;
  transition:.25s ease;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.year{
  font-size:13px;
  font-weight:800;
  margin-top:6px;
  visibility:hidden;
}
.year.show{visibility:visible}
.year.wrong{color:var(--red)}

.timeline{
  position:relative;
  margin-top:30px;
  padding:40px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg,transparent,rgba(127,61,255,.35),transparent);
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:18px;
  min-height:210px;
}

.placeholder{
  border:2px dashed var(--purple);
  border-radius:14px;
  opacity:.35;
}
</style>
</head>
<body>

<div class="game">

<header>
  <div class="hearts" id="hearts">❤️❤️❤️</div>
  <div class="score">⭐ Pontos: <strong id="score">0</strong></div>
</header>

<div class="board">
  <div class="instruction">
    Arraste o filme para a posição correta na linha do tempo.
  </div>

  <div id="current"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>
</div>

</div>

<script>
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG = "https://image.tmdb.org/t/p/w500";

let lives = 3;
let score = 0;

const YEARS = Array.from({length:100},(_,i)=>1926+i);
const MAX_PER_YEAR = 3;
const COOLDOWN = 20;

let yearPools = {};
let yearUsage = {};
let recentYears = [];

const timeline = document.getElementById("timeline");
const current = document.getElementById("current");

function updateHUD(){
  hearts.innerText = "❤️".repeat(lives);
  scoreEl.innerText = score;
}

function pickYear(){
  return YEARS.filter(y =>
    (yearUsage[y]||0) < MAX_PER_YEAR &&
    !recentYears.includes(y)
  )[Math.floor(Math.random()*YEARS.length)];
}

async function fetchYear(year){
  if(yearPools[year]) return;

  const page = Math.floor(Math.random()*6)+1;
  const res = await fetch(
    `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&primary_release_year=${year}&sort_by=popularity.desc&page=${page}`
  );
  const data = await res.json();

  yearPools[year] = data.results.filter(m =>
    m.poster_path && m.release_date
  );
}

async function getNextMovie(){
  let year;
  do{
    year = pickYear();
  }while(!year);

  await fetchYear(year);

  const pool = yearPools[year];
  if(!pool.length){
    yearUsage[year]=MAX_PER_YEAR;
    return getNextMovie();
  }

  const movie = pool.pop();
  yearUsage[year] = (yearUsage[year]||0)+1;

  recentYears.push(year);
  if(recentYears.length>COOLDOWN) recentYears.shift();

  return movie;
}

function createCard(movie,reveal){
  const year = movie.release_date.slice(0,4);
  const card = document.createElement("div");
  card.className="movie";
  card.dataset.year=year;
  card.draggable=true;

  card.innerHTML=`
    <img src="${IMG+movie.poster_path}">
    <div class="year ${reveal?"show":""}"><b>${year}</b></div>
  `;

  card.addEventListener("dragstart",()=>{
    dragged=card;
    placeholder=document.createElement("div");
    placeholder.className="movie placeholder";
    placeholder.style.width=card.offsetWidth+"px";
    placeholder.style.height=card.offsetHeight+"px";
  });

  card.addEventListener("dragend",()=>placeholder?.remove());
  return card;
}

timeline.addEventListener("dragover",e=>{
  e.preventDefault();
  const after=[...timeline.children].find(el=>{
    const r=el.getBoundingClientRect();
    return e.clientX<r.left+r.width/2;
  });
  after?timeline.insertBefore(placeholder,after):timeline.appendChild(placeholder);
});

timeline.addEventListener("drop",()=>{
  timeline.insertBefore(dragged,placeholder);
  dragged.querySelector(".year").classList.add("show");
  placeholder.remove();
  validate();
});

function reorder(){
  [...timeline.children]
    .sort((a,b)=>a.dataset.year-b.dataset.year)
    .forEach(el=>timeline.appendChild(el));
}

async function validate(){
  const years=[...timeline.children].map(e=>+e.dataset.year);
  const sorted=[...years].sort((a,b)=>a-b);

  if(JSON.stringify(years)===JSON.stringify(sorted)){
    score+=10;
  }else{
    lives--;
    dragged.querySelector(".year").classList.add("wrong");
    reorder();
    if(lives<=0){
      alert("💀 GAME OVER\nPontuação: "+score);
      location.reload();
      return;
    }
  }
  updateHUD();
  nextMovie();
}

async function nextMovie(){
  current.innerHTML="";
  const m=await getNextMovie();
  current.appendChild(createCard(m,false));
}

(async()=>{
  const first=await getNextMovie();
  timeline.appendChild(createCard(first,true));
  nextMovie();
})();
</script>

</body>
</html>
