<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MeiaWiki</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b26;
  --purple:#7f3dff;
  --red:#ff4d4d;
  --yellow:#ffd800;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#1b1038,var(--bg));
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:25px;
}

.game{max-width:980px;width:100%}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.hearts{font-size:20px}
.score{font-size:16px}

.board{
  background:var(--card);
  border-radius:22px;
  padding:25px;
  box-shadow:0 0 40px rgba(127,61,255,.18);
  text-align:center;
}

.instruction{
  font-family:'Press Start 2P', monospace;
  color:var(--yellow);
  font-size:12px;
  margin-bottom:25px;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

.current{margin-bottom:25px}

.movie{
  width:150px;
  cursor:grab;
  transition:.25s ease;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.year{
  font-size:13px;
  font-weight:800;
  margin-top:6px;
  visibility:hidden;
}

.year.show{visibility:visible}
.year.wrong{color:var(--red)}

.timeline{
  position:relative;
  margin-top:30px;
  padding:40px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(127,61,255,.35),
    transparent
  );
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:18px;
  min-height:210px;
}

.placeholder{
  border:2px dashed var(--purple);
  border-radius:14px;
  opacity:.35;
}
</style>
</head>
<body>

<div class="game">

<header>
  <div class="hearts" id="hearts">❤️❤️❤️</div>
  <div class="score">⭐ Pontos: <strong id="score">0</strong></div>
</header>

<div class="board">
  <div class="instruction">
    Arraste o filme para a posição correta na linha do tempo.
  </div>

  <div class="current" id="current"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>
</div>

</div>

<script>
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG = "https://image.tmdb.org/t/p/w500";

let lives = 3;
let score = 0;
let difficulty = 0;

let dragged = null;
let placeholder = null;

let movieQueue = [];
let usedIds = new Set();
let recentYears = [];

/* 🔥 40+ âncoras reais da história do cinema */
const yearAnchors = [
  1931,1937,1942,1949,
  1954,1959,
  1962,1968,
  1971,1974,1978,
  1981,1984,1987,
  1990,1993,1996,1999,
  2001,2003,2006,2009,
  2011,2014,2016,2018,
  2020,2021,2022,2023,2024,2025
];

const timeline = document.getElementById("timeline");
const current = document.getElementById("current");

function updateHUD(){
  document.getElementById("hearts").innerText = "❤️".repeat(lives);
  document.getElementById("score").innerText = score;
}

/* Evita repetir anos próximos */
function pickAnchor(){
  let pool = yearAnchors.filter(y =>
    !recentYears.some(r => Math.abs(r - y) < 4)
  );
  return pool.length
    ? pool[Math.floor(Math.random()*pool.length)]
    : yearAnchors[Math.floor(Math.random()*yearAnchors.length)];
}

async function fetchByAnchor(anchor){
  const start = anchor - 2;
  const end = anchor + 2;
  const page = Math.floor(Math.random() * 8) + 1;

  const res = await fetch(
    `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}
    &primary_release_date.gte=${start}-01-01
    &primary_release_date.lte=${end}-12-31
    &sort_by=popularity.desc
    &page=${page}`
  );

  const data = await res.json();

  movieQueue.push(...data.results.filter(m =>
    m.poster_path &&
    m.release_date &&
    m.popularity > 15 &&
    !usedIds.has(m.id)
  ));
}

async function getNextMovie(){
  while(movieQueue.length < 6){
    await fetchByAnchor(pickAnchor());
  }

  const movie = movieQueue.shift();
  usedIds.add(movie.id);

  const year = +movie.release_date.slice(0,4);
  recentYears.push(year);
  if(recentYears.length > 7) recentYears.shift();

  return movie;
}
</script>


</body>
</html>
