<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MeiaWiki</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b26;
  --purple:#7f3dff;
  --red:#ff4d4d;
  --yellow:#ffd800;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#1b1038,var(--bg));
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:25px;
}

.game{max-width:980px;width:100%}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.hearts{font-size:20px}
.score{font-size:16px}

.board{
  background:var(--card);
  border-radius:22px;
  padding:25px;
  box-shadow:0 0 40px rgba(127,61,255,.18);
  text-align:center;
}

.instruction{
  font-family:'Press Start 2P', monospace;
  color:var(--yellow);
  font-size:12px;
  margin-bottom:25px;
  text-shadow:
    -2px -2px 0 #000,
     2px -2px 0 #000,
    -2px  2px 0 #000,
     2px  2px 0 #000;
}

.current{margin-bottom:25px}

.movie{
  width:150px;
  cursor:grab;
  transition:.25s ease;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.year{
  font-size:12px;
  opacity:.85;
  margin-top:6px;
  visibility:hidden;
}

.year.show{visibility:visible}
.year.wrong{color:var(--red)}

.timeline{
  position:relative;
  margin-top:30px;
  padding:40px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(127,61,255,.35),
    transparent
  );
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:18px;
  min-height:210px;
}

.placeholder{
  border:2px dashed var(--purple);
  border-radius:14px;
  opacity:.35;
}
</style>
</head>
<body>

<div class="game">

<header>
  <div class="hearts" id="hearts">❤️❤️❤️</div>
  <div class="score">⭐ Pontos: <strong id="score">0</strong></div>
</header>

<div class="board">
  <div class="instruction">
    Arraste o filme para a posição correta na linha do tempo.
  </div>

  <div class="current" id="current"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>
</div>

</div>

<script>
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG = "https://image.tmdb.org/t/p/w500";

let lives = 3;
let score = 0;
let difficulty = 0;
let dragged = null;
let placeholder = null;

let movieQueue = [];
let usedIds = new Set();

const decades = [1940,1950,1960,1970,1980,1990,2000,2010,2020];

const timeline = document.getElementById("timeline");
const current = document.getElementById("current");

function updateHUD(){
  document.getElementById("hearts").innerText = "❤️".repeat(lives);
  document.getElementById("score").innerText = score;
}

function randomDecade(){
  return decades[Math.floor(Math.random() * decades.length)];
}

async function fetchDecade(decade){
  const yearStart = decade;
  const yearEnd = decade + 9;

  const page = Math.floor(Math.random() * 5) + 1;

  const res = await fetch(
    `https://api.themoviedb.org/3/discover/movie?api_key=${API_KEY}&primary_release_date.gte=${yearStart}-01-01&primary_release_date.lte=${yearEnd}-12-31&sort_by=popularity.desc&page=${page}`
  );

  const data = await res.json();

  const filtered = data.results.filter(m =>
    m.poster_path &&
    m.release_date &&
    m.popularity > 20 &&
    !usedIds.has(m.id)
  );

  movieQueue.push(...filtered);
}

async function getNextMovie(){
  while(movieQueue.length < 5){
    await fetchDecade(randomDecade());
  }
  const movie = movieQueue.shift();
  usedIds.add(movie.id);
  return movie;
}

async function createCard(movie, reveal){
  const year = movie.release_date.slice(0,4);

  const card = document.createElement("div");
  card.className = "movie";
  card.dataset.year = year;
  card.draggable = true;

  card.innerHTML = `
    <img src="${IMG + movie.poster_path}">
    <div class="year ${reveal ? "show" : ""}">${year}</div>
  `;

  enableDrag(card);
  return card;
}

function enableDrag(card){
  card.addEventListener("dragstart", ()=>{
    dragged = card;
    card.style.opacity = ".4";

    placeholder = document.createElement("div");
    placeholder.className = "movie placeholder";
    placeholder.style.width = card.offsetWidth+"px";
    placeholder.style.height = card.offsetHeight+"px";
  });

  card.addEventListener("dragend", ()=>{
    card.style.opacity = "1";
    placeholder?.remove();
  });
}

timeline.addEventListener("dragover", e=>{
  e.preventDefault();
  const after = getAfter(timeline, e.clientX);
  after ? timeline.insertBefore(placeholder, after)
        : timeline.appendChild(placeholder);
});

timeline.addEventListener("drop", ()=>{
  if(!dragged) return;

  timeline.insertBefore(dragged, placeholder);
  placeholder.remove();

  dragged.querySelector(".year").classList.add("show");
  validate();
});

function getAfter(container, x){
  const els = [...container.querySelectorAll(".movie:not(.placeholder)")];
  return els.reduce((c, el)=>{
    const box = el.getBoundingClientRect();
    const offset = x - box.left - box.width/2;
    if(offset < 0 && offset > c.offset){
      return {offset, el};
    }
    return c;
  },{offset:-Infinity}).el;
}

function validate(){
  const items = [...timeline.children];
  const years = items.map(i=>+i.dataset.year);
  const sorted = [...years].sort((a,b)=>a-b);

  if(JSON.stringify(years) === JSON.stringify(sorted)){
    score += Math.max(5, 15 - difficulty);
    difficulty++;
  }else{
    lives--;
    dragged.querySelector(".year").classList.add("wrong");
    updateHUD();

    if(lives <= 0){
      alert("💀 GAME OVER\nPontuação: " + score);
      location.reload();
      return;
    }
  }
  nextMovie();
}

async function nextMovie(){
  current.innerHTML = "";
  const movie = await getNextMovie();
  const card = await createCard(movie, false);
  current.appendChild(card);
  updateHUD();
}

(async()=>{
  const firstMovie = await getNextMovie();
  const firstCard = await createCard(firstMovie, true);
  timeline.appendChild(firstCard);
  nextMovie();
})();
</script>

</body>
</html>
