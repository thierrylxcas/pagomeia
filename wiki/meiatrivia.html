<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MovieTrivia • Linha do Tempo</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#0f0f14;
  --card:#1b1b26;
  --purple:#7f3dff;
  --purple2:#a57bff;
  --text:#fff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at top,#1b1038,var(--bg));
  color:var(--text);
  display:flex;
  justify-content:center;
  padding:30px 20px;
}

.game{max-width:900px;width:100%}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.stats{display:flex;gap:20px;font-size:14px}

.board{
  background:var(--card);
  border-radius:22px;
  padding:25px;
  box-shadow:0 0 40px rgba(127,61,255,.15);
  text-align:center;
}

.current{
  margin-bottom:20px;
}

.movie{
  width:150px;
  cursor:grab;
  transition:transform .25s ease;
}

.movie img{
  width:100%;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.6);
  pointer-events:none;
}

.movie p{
  font-size:13px;
  margin-top:8px;
}

.timeline{
  position:relative;
  margin-top:30px;
  padding:40px 10px;
}

.timeline::before{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(127,61,255,.35),
    transparent
  );
}

.timeline-zone{
  display:flex;
  justify-content:center;
  gap:18px;
  min-height:200px;
}

.placeholder{
  border:2px dashed var(--purple);
  border-radius:14px;
  opacity:.35;
  transition:all .2s ease;
}
</style>
</head>
<body>

<div class="game">

<header>
  <h2>🎬 MovieTrivia</h2>
  <div class="stats">
    <div>❌ Erros: <strong id="errors">0</strong></div>
  </div>
</header>

<div class="board">

  <p>Arraste o filme para a posição correta na linha do tempo.</p>

  <div class="current" id="current"></div>

  <div class="timeline">
    <div class="timeline-zone" id="timeline"></div>
  </div>

</div>

</div>

<script>
// ================= CONFIG =================
const API_KEY = "69f20920b621de40289df7481ea14b29";
const IMG = "https://image.tmdb.org/t/p/w500";

// Pool cronológico REAL (ordem escondida)
const pool = [
  {id:770, year:1939},
  {id:539, year:1960},
  {id:238, year:1972},
  {id:11, year:1977},
  {id:329, year:1993},
  {id:603, year:1999},
  {id:120, year:2001},
  {id:19995, year:2009},
  {id:299534, year:2019},
  {id:872585, year:2023}
];

let index = 0;
let errors = 0;
let dragged = null;
let placeholder = null;

const timeline = document.getElementById("timeline");
const currentDiv = document.getElementById("current");

// ================= LOAD =================
async function createCard(movie){
  const res = await fetch(
    `https://api.themoviedb.org/3/movie/${movie.id}?api_key=${API_KEY}&language=pt-BR`
  );
  const data = await res.json();

  const card = document.createElement("div");
  card.className = "movie";
  card.dataset.year = movie.year;
  card.draggable = true;
  card.innerHTML = `
    <img src="${IMG + data.poster_path}">
    <p>${data.title}</p>
  `;

  enableDrag(card);
  return card;
}

async function start(){
  const first = await createCard(pool[index++]);
  timeline.appendChild(first);
  nextMovie();
}

async function nextMovie(){
  if(index >= pool.length){
    alert("🎉 Você completou a linha do tempo!");
    return;
  }
  currentDiv.innerHTML = "";
  const card = await createCard(pool[index]);
  currentDiv.appendChild(card);
}

// ================= DRAG UX =================
function enableDrag(card){
  card.addEventListener("dragstart", ()=>{
    dragged = card;
    card.style.opacity = ".4";

    placeholder = document.createElement("div");
    placeholder.className = "movie placeholder";
    placeholder.style.width = card.offsetWidth+"px";
    placeholder.style.height = card.offsetHeight+"px";
  });

  card.addEventListener("dragend", ()=>{
    card.style.opacity = "1";
    placeholder?.remove();
    dragged = null;
  });
}

timeline.addEventListener("dragover", e=>{
  e.preventDefault();
  const after = getAfter(timeline, e.clientX);
  after ? timeline.insertBefore(placeholder, after)
        : timeline.appendChild(placeholder);
});

timeline.addEventListener("drop", ()=>{
  if(!dragged || !placeholder) return;

  timeline.insertBefore(dragged, placeholder);
  placeholder.remove();

  validate();
});

function getAfter(container, x){
  const els = [...container.querySelectorAll(".movie:not(.placeholder)")];
  return els.reduce((c, el)=>{
    const box = el.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if(offset < 0 && offset > c.offset){
      return {offset, el};
    }
    return c;
  }, {offset:-Infinity}).el;
}

// ================= CHECK =================
function validate(){
  const items = [...timeline.children];
  const years = items.map(i=>+i.dataset.year);
  const sorted = [...years].sort((a,b)=>a-b);

  if(JSON.stringify(years) === JSON.stringify(sorted)){
    index++;
    nextMovie();
  }else{
    errors++;
    document.getElementById("errors").innerText = errors;
    timeline.removeChild(dragged);
    nextMovie();
  }
}

start();
</script>

</body>
</html>
