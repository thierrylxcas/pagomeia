<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tierlist PagoMeia</title>

<!-- PIXEL FONT -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#121212;--row:#1e1e1e;--pool:#0e0e0e;--btn:#2ecc71;--text:#fff
}
body{
  background:var(--bg);color:var(--text);
  font-family:Arial;margin:0;padding:20px
}
.header-title{
  text-align:center;
  font-size:22px;
  font-family:'Press Start 2P', monospace;
  margin-bottom:12px
}
.controls{text-align:center;margin-bottom:15px}
button{
  background:var(--btn);border:none;
  padding:10px 14px;margin:4px;
  font-weight:bold;cursor:pointer
}
.tier{display:flex;margin-bottom:6px}
.label{
  width:160px;min-height:90px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:bold;
  color:#000;text-align:center;
  word-break:break-word
}
.row{
  flex:1;background:var(--row);
  display:flex;gap:6px;
  padding:6px;min-height:90px
}
.deleteBtn{background:#e74c3c;margin-left:6px}
.pool{
  background:var(--pool);padding:10px;
  display:flex;gap:6px;
  flex-wrap:wrap;margin-top:20px
}
.img-wrapper{
  position:relative;width:60px;height:60px
}
.img-wrapper img{
  width:100%;height:100%;object-fit:cover
}
.remove-img{
  position:absolute;top:-6px;right:-6px;
  width:18px;height:18px;
  background:#e74c3c;border-radius:50%;
  font-size:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer
}
.modal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  align-items:center;justify-content:center;
  z-index:1000
}
.modal-content{
  background:#1e1e1e;padding:20px;
  border-radius:8px;width:260px
}
.color-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;margin:15px 0
}
.color{
  width:30px;height:30px;
  border-radius:4px;cursor:pointer
}
.option{
  padding:10px;margin:6px 0;
  background:#2a2a2a;
  border-radius:6px;
  text-align:center;cursor:pointer
}
</style>
</head>

<body>

<div class="header-title" contenteditable id="title">
Minha Tier List
</div>

<div class="controls">
  <button id="addTier">Criar bloco</button>
  <button id="templateBtn">Categorias</button>
  <button id="themeBtn">Temas</button>
  <button id="exportBtn">Exportar PNG</button>
  <input type="file" id="upload" multiple accept="image/*">
</div>

<div id="tiers"></div>
<div class="pool" id="pool"></div>

<!-- MODAIS -->
<div class="modal" id="tierModal">
  <div class="modal-content">
    <strong>Cor do bloco</strong>
    <div class="color-grid" id="colorGrid"></div>
    <button id="confirmTier">Criar bloco</button>
  </div>
</div>

<div class="modal" id="themeModal">
  <div class="modal-content">
    <strong>Temas</strong>
    <div class="option" onclick="setTheme('dark')">🌑 Dark</div>
    <div class="option" onclick="setTheme('purple')">🟣 Roxo</div>
    <div class="option" onclick="setTheme('green')">🟢 Verde</div>
    <div class="option" onclick="setTheme('orange')">🟠 Laranja</div>
  </div>
</div>

<div class="modal" id="templateModal">
  <div class="modal-content">
    <strong>Categorias</strong>
    <div class="option" onclick="loadTemplate('games')">🎮 Games</div>
    <div class="option" onclick="loadTemplate('movies')">🎬 Filmes</div>
    <div class="option" onclick="loadTemplate('series')">📺 Séries</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const tiers=document.getElementById('tiers');
const pool=document.getElementById('pool');
const colors=['#ff4d4d','#ff9f1a','#f1c40f','#2ecc71','#3498db','#9b59b6'];
let selectedColor=colors[0];

function initSortable(){
  document.querySelectorAll('.row,.pool').forEach(el=>{
    Sortable.create(el,{group:'shared',animation:150});
  });
}

function createImg(src){
  const w=document.createElement('div');
  w.className='img-wrapper';
  w.innerHTML=`<img src="${src}"><div class="remove-img">×</div>`;
  return w;
}

/* ===== FIX: criar bloco ===== */
function createTier(text='Novo',color=selectedColor){
  const tier=document.createElement('div');
  tier.className='tier';
  tier.innerHTML=`
    <div class="label" contenteditable style="background:${color}">${text}</div>
    <div class="row"></div>
    <button class="deleteBtn">X</button>
  `;
  tiers.appendChild(tier);
  initSortable();
  saveState();
}

/* MODAL CRIAR */
addTier.onclick = function(){
  colorGrid.innerHTML='';
  colors.forEach(function(c){
    const d=document.createElement('div');
    d.className='color';
    d.style.background=c;
    d.onclick = function(){ selectedColor = c; };
    colorGrid.appendChild(d);
  });
  tierModal.style.display='flex';
};

confirmTier.onclick=()=>{
  createTier();
  tierModal.style.display='none';
};

/* DELEGAÇÃO – EXCLUIR */
document.addEventListener('click',e=>{
  if(e.target.classList.contains('deleteBtn')){
    e.target.closest('.tier').remove();
    saveState();
  }
  if(e.target.classList.contains('remove-img')){
    e.target.parentElement.remove();
    saveState();
  }
});

/* TEMPLATES */
function loadTemplate(type){
  tiers.innerHTML='';
  const presets={
    games:['S','A','B','C','D'],
    movies:['Masterpiece','Great','Good','Ok','Bad'],
    series:['Excelente','Bom','Médio','Ruim']
  }[type];
  presets.forEach((t,i)=>createTier(t,colors[i%colors.length]));
  templateModal.style.display='none';
}

/* AUTO SAVE (ÚNICO) */
function saveState(){
  localStorage.setItem('tier_state',JSON.stringify({
    title:title.innerText,
    tiers:tiers.innerHTML,
    pool:pool.innerHTML
  }));
}

function loadState(){
  const data=localStorage.getItem('tier_state');
  if(!data){
    loadTemplate('series'); // padrão inicial
    return;
  }
  const s=JSON.parse(data);
  title.innerText=s.title;
  tiers.innerHTML=s.tiers;
  pool.innerHTML=s.pool;
  initSortable();
}

templateBtn.onclick=()=>templateModal.style.display='flex';
themeBtn.onclick=()=>themeModal.style.display='flex';

/* ===== FIX: remover undefined ===== */
document.querySelectorAll('.modal').forEach(m=>{
  m.onclick = function(e){
    if(e.target === m){
      m.style.display = 'none';
    }
  };
});

title.addEventListener('input',saveState);
window.addEventListener('load',loadState);
</script>

</body>
</html>
